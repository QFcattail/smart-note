<svg viewBox="0 0 780 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="智能研学笔记本系统架构图" style="width:100%;height:auto;display:block">
  <defs>
    <marker id="arq" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#7d9077"/>
    </marker>
    <filter id="rough" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2"/>
    </filter>
  </defs>
  <style>
    .bx{fill:rgba(251,248,241,.9);stroke-width:1.6;filter:url(#rough)}
    .bt{font-family:"ZCOOL XiaoWei",serif;font-size:17px;fill:#2e4438;letter-spacing:2px}
    .bs{font-family:"LXGW WenKai Screen",sans-serif;font-size:11.5px;fill:#56705f;letter-spacing:.5px}
    .ly{font-family:"ZCOOL XiaoWei",serif;font-size:14px;fill:#8ba092;letter-spacing:4px}
    .fl{stroke:#7d9077;stroke-width:1.7;fill:none;opacity:.75}
    .grp{fill:none;stroke:#C9B48A;stroke-width:1.4;stroke-dasharray:1 6;stroke-linecap:round;opacity:.9}
  </style>

  <!-- 层标注 -->
  <text class="ly" x="26" y="70">输入</text>
  <text class="ly" x="26" y="205">理解</text>
  <text class="ly" x="26" y="345">功能</text>
  <text class="ly" x="26" y="485">输出</text>

  <!-- 输入层 -->
  <g>
    <rect class="bx" x="90" y="30" width="180" height="66" rx="14" stroke="#A67B4F"/>
    <text class="bt" x="180" y="57" text-anchor="middle">手写拍照</text>
    <text class="bs" x="180" y="80" text-anchor="middle">文字识别 · 草稿纸 / 展品铭牌</text>

    <rect class="bx" x="300" y="30" width="180" height="66" rx="14" stroke="#A67B4F"/>
    <text class="bt" x="390" y="57" text-anchor="middle">语音输入</text>
    <text class="bs" x="390" y="80" text-anchor="middle">语音识别 → 文本</text>

    <rect class="bx" x="510" y="30" width="180" height="66" rx="14" stroke="#A67B4F"/>
    <text class="bt" x="600" y="57" text-anchor="middle">课堂关键词</text>
    <text class="bs" x="600" y="80" text-anchor="middle">随记随存 · YAML</text>
  </g>

  <!-- 理解层 -->
  <rect class="bx" x="210" y="160" width="360" height="78" rx="16" stroke="#7fa5ba" style="fill:rgba(168,200,216,.14)"/>
  <text class="bt" x="390" y="192" text-anchor="middle">文心千帆大模型</text>
  <text class="bs" x="390" y="216" text-anchor="middle">语义理解 + 联网搜索（百度搜索插件）· 答案渲染为 HTML</text>

  <!-- 功能层 -->
  <g>
    <rect class="bx" x="90" y="300" width="180" height="72" rx="14" stroke="#7A9E6E" style="fill:rgba(122,158,110,.12)"/>
    <text class="bt" x="180" y="330" text-anchor="middle">实时问答</text>
    <text class="bs" x="180" y="354" text-anchor="middle">问题 → 简洁答案 + 推荐资料</text>

    <rect class="bx" x="300" y="300" width="180" height="72" rx="14" stroke="#7A9E6E" style="fill:rgba(122,158,110,.12)"/>
    <text class="bt" x="390" y="330" text-anchor="middle">笔记整理</text>
    <text class="bs" x="390" y="354" text-anchor="middle">关键词 → 图文并茂的笔记</text>

    <rect class="bx" x="510" y="300" width="180" height="72" rx="14" stroke="#7A9E6E" style="fill:rgba(122,158,110,.12)"/>
    <text class="bt" x="600" y="330" text-anchor="middle">录课整理</text>
    <text class="bs" x="600" y="354" text-anchor="middle">视频 → 字幕时间码定位</text>
  </g>

  <!-- 输出层 -->
  <g>
    <rect class="bx" x="180" y="440" width="190" height="62" rx="14" stroke="#b98a63"/>
    <text class="bt" x="275" y="467" text-anchor="middle">屏幕显示</text>
    <text class="bs" x="275" y="488" text-anchor="middle">PyQt 界面 · 电阻触摸屏</text>

    <rect class="bx" x="410" y="440" width="190" height="62" rx="14" stroke="#b98a63"/>
    <text class="bt" x="505" y="467" text-anchor="middle">邮件导出</text>
    <text class="bs" x="505" y="488" text-anchor="middle">HTML 笔记 · 多端查看</text>
  </g>

  <!-- 硬件底座 -->
  <rect class="grp" x="76" y="516" width="628" height="34" rx="16"/>
  <text class="bs" x="390" y="538" text-anchor="middle">硬件底座：树莓派 3B · CSI/USB 摄像头 · 4 寸 HDMI 屏 · 麦克风 · 充电宝供电 · 激光切割 + 3D 打印外壳</text>

  <!-- 连线 -->
  <path class="fl" d="M180,96 L180,130 L370,130 L370,158" marker-end="url(#arq)"/>
  <path class="fl" d="M390,96 L390,158" marker-end="url(#arq)"/>
  <path class="fl" d="M600,96 L600,130 L412,130 L412,158" marker-end="url(#arq)"/>
  <path class="fl" d="M300,238 L300,266 L180,266 L180,298" marker-end="url(#arq)"/>
  <path class="fl" d="M390,238 L390,298" marker-end="url(#arq)"/>
  <path class="fl" d="M480,238 L480,266 L600,266 L600,298" marker-end="url(#arq)"/>
  <path class="fl" d="M180,372 L180,406 L260,406 L260,438" marker-end="url(#arq)"/>
  <path class="fl" d="M390,372 L390,406 L300,406 L300,438" marker-end="url(#arq)"/>
  <path class="fl" d="M420,372 L420,406 L490,406 L490,438" marker-end="url(#arq)"/>
  <path class="fl" d="M600,372 L600,406 L520,406 L520,438" marker-end="url(#arq)"/>
</svg>
